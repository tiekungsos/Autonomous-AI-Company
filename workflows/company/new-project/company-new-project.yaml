name: company-new-project
description: |
  Start a new software project with the AI company through a guided chat (สร้างโปรเจกต์ใหม่ / ระบบใหม่ /
  อยากได้ระบบ ... / สร้างระบบ WMS, ERP, POS, e-commerce, CRM, booking, API ...). The Product
  Manager interviews the user one question at a time with selectable options (scope, users and
  roles, which existing systems to resemble, MVP phase, stack, budget, parallelism), writes the
  requirements, asks for confirmation, then creates the project in the Company Layer and
  optionally starts autonomous development. Use this whenever the user wants a new system built.
  Each question appears with answer buttons in the project's RUNS tab under "Needs your input"
  (and can also be answered by typing in the chat); tell the user this when starting the run.

model: medium
mutates_checkout: false

returns: create
outcome_field: created

nodes:
  - id: interview
    loop_group:
      until_bash: 'ready=$ask.output.ready; [ "$ready" = true ]'
      max_iterations: 3
      nodes:
        - id: ask
          command: interview
          model: "@pm"
          mutates_checkout: false
          output_format:
            type: object
            properties:
              ready: { type: boolean }
              notes: { type: string }
              question: { type: string }
              options:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: string }
                    label: { type: string }
                  required: [id, label]
              project:
                type: object
                properties:
                  name: { type: string }
                  description: { type: string }
                  tech_stack: { type: string }
                  requirements: { type: string }
                  budget_usd: { type: number }
                  max_concurrency: { type: integer }
                  start: { type: boolean }
                required: [name, description, tech_stack, requirements, budget_usd, max_concurrency, start]
            required: [ready, notes, question, options, project]

        - id: answer
          depends_on: [ask]
          when: "$ask.output.ready == 'false'"
          wait:
            attention: "$ask.output.question"
            form: multi_select
            options: "$ask.output.options"

  - id: create
    script: create-project
    runtime: bun
    depends_on: [interview]
    with:
      spec: "$interview.output"
    output_format:
      type: object
      properties:
        created: { type: boolean }
        project_id: { type: string }
        started: { type: boolean }
        url: { type: string }
        summary: { type: string }
      required: [created, project_id, started, url, summary]
