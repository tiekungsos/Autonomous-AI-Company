# Optional PostgreSQL for web authentication and multi-user installs.
# The default install runs Archon on SQLite inside $ARCHON_HOME with no containers.
# Start: docker compose up -d postgres   then set DATABASE_URL in $ARCHON_HOME/.env (see infrastructure/archon-home.env.example).
services:
  postgres:
    image: postgres:16-alpine
    container_name: autonomous-ai-company-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: archon
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - aicompany-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  aicompany-postgres:
